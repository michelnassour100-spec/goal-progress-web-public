<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>خطوة بخطوة</title><style>body{background:#102d25;color:white;font:20px system-ui;margin:30px auto;padding:20px;max-width:500px}main{background:#1b4436;padding:24px;border-radius:20px}input,button{padding:14px;width:100%;box-sizing:border-box;margin:8px 0;border-radius:10px}button{background:#8ce5b8}progress{width:100%;height:22px}</style><main><h1>خطوة بخطوة</h1><p>الهدف 9,000 يورو</p><h2 id="sum">0 €</h2><progress id="bar" max="9000" value="0"></progress><p id="left"></p><form id="f"><input id="a" type="number" min="1" required placeholder="المبلغ المحصّل باليورو"><input id="s" required placeholder="المشروع"><button>إضافة مبلغ مستلم</button></form><ul id="list"></ul><small>البيانات محفوظة على هذا الجهاز فقط.</small></main><script>let d=JSON.parse(localStorage.getItem('income9000')||'[]');function show(){let t=d.reduce((s,x)=>s+x.a,0);document.querySelector('#sum').textContent=t+' €';document.querySelector('#bar').value=t;document.querySelector('#left').textContent='المتبقي '+Math.max(0,9000-t)+' €';document.querySelector('#list').replaceChildren(...d.map(x=>{let l=document.createElement('li');l.textContent=x.a+' € - '+x.s;return l}))}document.querySelector('#f').onsubmit=e=>{e.preventDefault();d.push({a:+document.querySelector('#a').value,s:document.querySelector('#s').value});localStorage.setItem('income9000',JSON.stringify(d));e.target.reset();show()};show()</script></html>
